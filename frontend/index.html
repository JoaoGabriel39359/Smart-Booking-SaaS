<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Agenda SaaS | Professor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <div class="max-w-7xl mx-auto py-10 px-4">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border-b pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 italic tracking-tighter">
                    Agenda <span class="text-blue-600">SaaS</span>
                </h1>
                <p class="text-slate-500 font-medium text-sm">Painel de Gestão do Professor</p>
            </div>
            <nav class="bg-slate-200 p-1 rounded-xl flex space-x-1 shadow-inner overflow-x-auto">
                <button onclick="trocarAba('agenda')" id="btnTabAgenda" class="tab-btn active">Agenda</button>
                <button onclick="trocarAba('alunos')" id="btnTabAlunos" class="tab-btn">Alunos</button>
                <button onclick="trocarAba('turmas')" id="btnTabTurmas" class="tab-btn">Turmas</button>
                <button onclick="trocarAba('grade')" id="btnTabGrade" class="tab-btn">Grade Base</button>
            </nav>
        </header>

        <main>
            <section id="abaAgenda" class="aba-content space-y-6">
                <div class="card">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center">
                            <i class="fa-solid fa-calendar-check mr-2 text-green-500"></i> Próximas Aulas
                        </h2>
                        <button onclick="abrirModalAgendamentoAvulso()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> Nova Aula Individual
                        </button>
                    </div>
                    <div id="listaAgenda" class="grid-layout"></div>
                </div>
            </section>

            <section id="abaAlunos" class="aba-content hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">Gestão de Alunos</h2>
                    <button onclick="abrirModalAluno()" class="btn-primary">
                        <i class="fa-solid fa-user-plus"></i> Novo Aluno
                    </button>
                </div>
                <div class="card">
                    <div id="listaAlunos" class="grid-layout"></div>
                </div>
            </section>

            <section id="abaTurmas" class="aba-content hidden p-4">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-xl font-black text-slate-800 italic uppercase tracking-tighter">Gestão de Turmas</h2>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Configure os horários fixos</p>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="gerarAulasDoMes()" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-600 shadow-lg shadow-emerald-100 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Mês
                        </button>
                        
                        <button onclick="abrirModalTurma()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> Nova Turma
                        </button>
                    </div>
                </div>

                <div id="listaTurmas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </section>

            <section id="abaGrade" class="aba-content hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-8 card">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold">Calendário de Turnos</h2>
                        <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-xl">
                            <button onclick="mudarMes(-1)" class="p-2 hover:bg-white rounded-lg transition"><i class="fa-solid fa-chevron-left"></i></button>
                            <span id="mesAtualExtenso" class="font-bold text-sm min-w-[140px] text-center capitalize"></span>
                            <button onclick="mudarMes(1)" class="p-2 hover:bg-white rounded-lg transition"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="calendario-grid" id="calendarioMensal"></div>
                </div>

                <div class="lg:col-span-4 space-y-6">
                    <div id="cardAcaoDia" class="card border-2 border-slate-100">
                        <h2 id="tituloDiaSelecionado" class="text-lg font-black mb-1 text-slate-800">Selecione um dia</h2>
                        <form id="formGrade" class="space-y-4">
                            <input type="hidden" id="diaSemanaOculto">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="time" id="inicioGrade" required class="input-field">
                                <input type="time" id="fimGrade" required class="input-field">
                            </div>
                            <button type="submit" class="w-full btn-blue">Salvar Turno</button>
                        </form>
                    </div>
                    <div class="card">
                        <h3 class="font-bold text-slate-700 mb-4 text-[10px] uppercase border-b pb-2 tracking-widest">Grade Semanal</h3>
                        <div id="gridSemanal" class="space-y-4 overflow-y-auto max-h-[300px] custom-scroll"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
