<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | One School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-100">
        <div class="bg-indigo-600 p-10 text-center relative">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500 rounded-full opacity-20"></div>
            <img src="/static/logo.png" alt="Logo" class="h-16 mx-auto mb-4 bg-white p-2 rounded-2xl shadow-lg">
            <h1 class="text-white text-2xl font-black uppercase tracking-tighter italic">One <span
                    class="text-pink-400">School</span></h1>
            <p class="text-indigo-100 text-xs font-bold uppercase tracking-widest mt-2">Acesso do Professor</p>
        </div>

        <form id="loginForm" class="p-10 space-y-6">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Usuário</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-4 text-indigo-500"></i>
                    <input type="text" id="username" required
                        class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl py-3 pl-12 pr-4 outline-none focus:border-indigo-500 transition-all font-bold text-sm">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Senha
                    Secreta</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-4 text-indigo-500"></i>
                    <input type="password" id="password" required
                        class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl py-3 pl-12 pr-4 outline-none focus:border-indigo-500 transition-all font-bold text-sm">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all uppercase text-xs tracking-widest">
                Entrar no Painel
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    // SALVA O TOKEN NO NAVEGADOR
                    localStorage.setItem('token_professor', data.access_token);
                    window.location.href = '/painel'; // Vai para o painel
                } else {
                    alert("Acesso negado. Verifique suas credenciais.");
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
            }
        };
    </script>
</body>

</html>
