version: '3.8'

services:
  db:
    image: postgres:15
    container_name: agenda_db
    restart: always
    environment:
      POSTGRES_USER: joaogabriel39359@gmail.com
      POSTGRES_PASSWORD: 8899jgvb
      POSTGRES_DB: agenda_saas
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: agenda_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  # --- NOVO SERVIÇO: WHATSAPP ---
  evolution_api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - API_KEY=422442244224 # Senha para o seu código falar com a API
      - AUTHENTICATION_TYPE=apikey
      - CONFIG_SESSION_PHONE_NUMBER=55... # Opcional: seu número
    volumes:
      - evolution_instances:/evolution/instances

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command:
      - "http"
      - "api:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - api

volumes:
  evolution_instances: